services:
  # 1. Auth Service
  - type: web
    name: auth-service
    runtime: docker
    dockerContext: backend/auth-service
    dockerFilePath: backend/auth-service/Dockerfile
    envVars:
      - key: PORT
        value: 8082
      - key: AUTH_DB_URL
        sync: false
        placeholder: "jdbc:mysql://YOUR_AIVEN_HOST:PORT/event_management_auth_db"
      - key: DB_USERNAME
        sync: false
        placeholder: "avnadmin"
      - key: DB_PASSWORD
        sync: false
        placeholder: "your_aiven_password"

  # 2. Event Service
  - type: web
    name: event-service
    runtime: docker
    dockerContext: backend/event-service
    dockerFilePath: backend/event-service/Dockerfile
    envVars:
      - key: PORT
        value: 8081
      - key: EVENT_DB_URL
        sync: false
        placeholder: "jdbc:mysql://YOUR_AIVEN_HOST:PORT/event_management_event_db"
      - key: DB_USERNAME
        sync: false
        placeholder: "avnadmin"
      - key: DB_PASSWORD
        sync: false
        placeholder: "your_aiven_password"

  # 3. API Gateway
  - type: web
    name: api-gateway
    runtime: docker
    dockerContext: backend/api-gateway
    dockerFilePath: backend/api-gateway/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          type: web
          property: host
      - key: EVENT_SERVICE_URL
        fromService:
          name: event-service
          type: web
          property: host
      - key: FRONTEND_URL
        sync: false
        placeholder: "https://your-app.vercel.app"
